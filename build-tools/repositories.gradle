String cldrMavenUrl="http://nexus-private.hortonworks.com/nexus/content/groups/public"
String gbnUrl="http://nexus-private.hortonworks.com/nexus/content/groups/public"

repositories {
    maven {
        url gbnUrl
        setAllowInsecureProtocol(true);
        allowInsecureProtocol=true
    }
    maven {
        url cldrMavenUrl;
        setAllowInsecureProtocol(true);
        allowInsecureProtocol = true;
    }
    mavenCentral()
}